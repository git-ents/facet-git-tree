subject_length = 90
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
hard_line_length = 0
line_length = 250
style = "conventional"
allowed_types = [
    "fix",
    "feat",
    "chore",
    "docs",
    "style",
    "refactor",
    "revert",
    "perf",
    "test",
    "release",
    "deps",
]
# `committed` checks scopes only when this list is nonempty; the empty scope
# allows unscoped subjects while rejecting every actual scope.
allowed_scopes = [""]
merge_commit = false
no_fixup = false

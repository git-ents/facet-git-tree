[package]
name = "facet-git-tree"
version = "0.1.0"
edition = "2024"
readme = "README.adoc"
description = "Format crate for facet: serialize and deserialize facet values as Git tree objects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/git-ents/facet-git-tree"

[features]
# The pin towers' codec fixture (`schema::codec`) needs a `Def::DynamicValue`
# type reachable unconditionally — its generation id must not depend on which
# features happen to be enabled — so `facet-value` is a plain dependency
# below, not gated by this feature. `value` instead gates the QName / UUID
# downcast fast paths and the schema-driven read/write modules; the
# `facet_value::Value` number downcast is unconditional, so dynamic numbers
# encode identically with and without it.
#
# NOTE (release notes): the unconditional number downcast can change object
# ids for builds *without* the `value` feature that previously wrote very
# large or float-backed dynamic numbers through the lossy vtable path.
value = []

[dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
facet-value = "0.50.0-rc.5"
gix-hash = { version = "0.25.1", features = ["sha1"] }
gix-object = "0.62.0"
gix-odb = "0.82.0"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
proptest = "1"
rstest = "0.26"

[[test]]
name = "schema_driven"
required-features = ["value"]

[[test]]
name = "schema_write"
required-features = ["value"]

[[test]]
name = "migration_apply"
required-features = ["value"]

[[test]]
name = "legacy_compat"
required-features = ["value"]
